<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz — ELE 146</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <div class="brand">ELE 146 <span>Study Hub</span></div>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/study/index.html">Study Materials</a>
      <a href="/quiz/index.html" class="active">Quiz</a>
    </div>
  </nav>
</header>

<main>
  <div class="breadcrumb"><a href="/index.html">Home</a> / Quiz</div>
  <h1>Quiz</h1>

  <div class="quiz-score-bar">
    <label for="week-select">Week: <select id="week-select"></select></label>
    <span id="score-text">Score: 0 / 0 answered</span>
    <button id="retry-btn" class="btn secondary">Retry quiz</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="mc-panel">Multiple Choice</button>
    <button class="tab-btn" data-tab="flashcard-panel">Flashcards</button>
  </div>

  <div id="mc-panel" class="tab-panel active">
    <div id="mc-container"></div>
  </div>

  <div id="flashcard-panel" class="tab-panel">
    <p>Click a card to flip between the question and the answer.</p>
    <div id="flashcard-container" class="flashcard-grid"></div>
  </div>
</main>

<footer class="site-footer">
  ELE 146 — Electric Motor Control · Personal study site
</footer>

<script src="/js/quiz.js"></script>
</body>
</html>
